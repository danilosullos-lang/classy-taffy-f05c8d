name: Aetheria RPG - game checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sync and validate compact KayKit CC0 skins and animations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/sync-kaykit-assets.sh
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check game integrity
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts=[]
                  self.active=False
              def handle_starttag(self, tag, attrs):
                  if tag == "script" and not dict(attrs).get("src"):
                      self.active=True
              def handle_endtag(self, tag):
                  if tag == "script":
                      self.active=False
              def handle_data(self, data):
                  if self.active:
                      self.parts.append(data)
          p=Scripts()
          p.feed(Path("index.html").read_text(encoding="utf-8"))
          Path("/tmp/aetheria-inline.js").write_text("\n".join(p.parts), encoding="utf-8")
          PY
          node --check /tmp/aetheria-inline.js

  browser-smoke:
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validated assets
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local game server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/aetheria-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aetheria-http.log
          exit 1
      - name: Run full browser smoke tests
        env:
          GAME_URL: http://127.0.0.1:4173
        run: node tests/game-smoke.cjs
