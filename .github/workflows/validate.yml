name: Validate Aetheria client

on:
  push:
    branches:
      - main
      - "aetheria/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run check
      - name: Production build
        run: npm run build
